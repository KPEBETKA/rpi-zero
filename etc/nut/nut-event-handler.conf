# NUT notifier configuration.

# --- Mattermost -------------------------------------------------------------
# Set your Mattermost webhook URL here. Format:
#   https://<mattermost-host>/hooks/<token>
WEBHOOK_URL="${WEBHOOK_URL:-https://<mattermost-host>/hooks/<token>}"
MATTERMOST_USER="${MATTERMOST_USER:-<username>}"

# --- UPS --------------------------------------------------------------------
UPS_NAME_DEFAULT="${UPS_NAME_DEFAULT:-<upsname>}"

# --- Paths ------------------------------------------------------------------
SEND_SCRIPT="${SEND_SCRIPT:-/usr/local/bin/nut-mattermost-send.sh}"
PID_FILE="${PID_FILE:-/var/run/nut/battery-tracker.pid}"
TRACKER_SCRIPT="${TRACKER_SCRIPT:-/usr/local/bin/nut-battery-tracker.sh}"

# --- Battery tracker --------------------------------------------------------
POLL_INTERVAL="${POLL_INTERVAL:-60}"
MAX_FAILS="${MAX_FAILS:-5}"